[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liq-evolution"
version = "0.3.0"
description = "Trading strategy evolution layer for the LIQ Stack"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Latent Infinity", email = "dev@latentinfinity.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "liq-gp>=0.1.2",
    "liq-core>=0.1.1",
    "liq-datasets>=0.1.3",
    "liq-sim>=0.1.1",
    "liq-features>=0.1.1",
    "liq-signals>=0.1.1",
    "liq-ta>=0.1.1",
    "numpy>=2.0",
    "polars>=0.20",
    "pydantic>=2.0",
    "rich>=13.0",
    "structlog>=24.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# runner = ["liq-core", "liq-runner", "liq-signals"]  # uncomment when available
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.14",
    "pyyaml>=6.0",
    "ty>=0.0.1",
]

[project.urls]
Homepage = "https://github.com/Latent-Infinity/liq-evolution"
Repository = "https://github.com/Latent-Infinity/liq-evolution"

[project.scripts]
liq-evolution = "liq.evolution.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.14",
    "pyyaml>=6.0",
    "ty>=0.0.1",
    # Development only, never imported: it runs the forbidden-package contract
    # below. Floor and declaration style follow `liq-alert`, which is where this
    # contract's pattern comes from.
    "import-linter>=2.0",
]

[tool.uv.sources]
liq-gp = { path = "../liq-gp", editable = true }
liq-ta = { path = "../liq-ta/crates/liq-ta-python", editable = true }
liq-features = { path = "../liq-features", editable = true }
liq-datasets = { path = "../liq-datasets", editable = true }
liq-core = { path = "../liq-core", editable = true }
liq-sim = { path = "../liq-sim", editable = true }
liq-signals = { path = "../liq-signals", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/liq"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG",   # test protocol stubs must match signatures
    "E731",  # lambda assignments common in test fixtures
    "SIM105", # try/except/pass intentional in performance tests
]

[tool.ruff.lint.isort]
known-first-party = ["liq"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
extra-paths = [
    "./src",
    "../liq-core/src",
    "../liq-datasets/src",
    "../liq-sim/src",
    "../liq-gp/src",
    "../liq-signals/src",
    "../liq-features/src",
    "../liq-ta/crates/liq-ta-python/src",
    "../liq-store/src",
]

[tool.ty.rules]
# Start permissive -- tighten incrementally

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=liq.evolution --cov-report=term-missing --cov-fail-under=95"
# `tests/` collects everything, including the two trees below. They are named
# separately because they are different kinds of thing and are addressable as
# such (`uv run pytest tests/facts -q`):
#   tests/facts/   — fact evidence. Cited by the evidence index, watched by the
#                    fact-surface gate, changed only under a Fact Change or an
#                    Evidence Maintenance task.
#   tests/support/ — oracles, harnesses, comparators and the port contract
#                    bases under tests/support/contract/. Never evidence in
#                    their own right; declared inside the surfaces that lean on
#                    them.
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "facts: fact evidence (tests/facts/)",
    "support: oracles, harnesses and port contracts (tests/support/)",
]

[tool.coverage.run]
source = ["src/liq/evolution"]
omit = [
    "src/liq/evolution/adapters/signals_provider.py",  # requires liq-core (not yet available)
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

# Enforced by `uv run lint-imports --config pyproject.toml`, wired into
# `liq-experiments/bin/verify-ecology`.
#
# READ THIS BEFORE ADDING A `liq.*` ENTRY BELOW: you cannot. `liq` is a
# namespace package, and import-linter rejects any subpackage of one as a
# forbidden module — so `liq.live`, `liq.trade`, `liq.sim`, `liq.gp`,
# `liq.risk`, `liq.data` and the rest are unnameable here, and an entry naming
# one does not silently match nothing, it fails the run with a configuration
# error. `liq-alert` hit this first and records it in its own `pyproject.toml`.
# The first-party half of the boundary is closed instead by
# `tests/support/boundary_scan.py`, which parses the AST of the ecology package
# and is asserted by `tests/facts/test_boundaries.py`. That test also walks the
# installed dependency graph, which no static import contract can see. This
# contract enforces the part that is expressible; that test enforces the rest.
[tool.importlinter]
root_package = "liq.evolution"
# Required because the forbidden list names third-party packages; without it the
# contract silently covers only first-party imports, which is the half that
# matters least here.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Nothing reaches a broker, an execution client or an HTTP transport"
type = "forbidden"
# The whole library, not just the ecology package: the requirement is that this
# system cannot submit an order by construction rather than by configuration,
# and a broker imported two modules away is still linked in. Nothing here
# imports any of these today, so the wider scope costs nothing and says more.
source_modules = ["liq.evolution"]
forbidden_modules = [
    # HTTP transports. Market data arrives through the guarded data service, in
    # the consumer repository; nothing in this library talks to a network.
    "aiohttp",
    "httpx",
    "requests",
    "urllib3",
    # Brokers and execution clients. Market-data vendors are deliberately
    # absent — reading a tape is not trading.
    "alpaca",
    "alpaca_trade_api",
    "binance",
    "cbpro",
    "ccxt",
    "coinbase",
    "ib_async",
    "ib_insync",
    "ibapi",
    "kiteconnect",
    "oandapyV20",
    "robin_stocks",
    "schwab",
    "tda",
    "tradestation",
]
